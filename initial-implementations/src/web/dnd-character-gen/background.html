<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Background Demo</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      background-image: url("/dnd-village.jpg");
      background-size: cover;        /* fill viewport */
      background-position: center;   /* keep center visible */
      background-repeat: no-repeat;
      background-attachment: fixed;  /* optional */
      min-height: 100vh;
    }

    /* Optional overlay for readability */
    .bg-overlay {
      background: rgba(0, 0, 0, 0.5);
      min-height: 100vh;
    }
  </style>
</head>
<body>

  <div class="bg-overlay d-flex align-items-center">
    <div class="container text-center text-white">
      <h1 class="display-4">Centered Cropped Background</h1>
      <p class="lead">On smaller screens, left and right are cropped automatically.</p>
      <button class="btn btn-primary btn-lg">Example Button</button>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
